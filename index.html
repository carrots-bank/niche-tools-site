<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private</title>
<style>:root{--paper:#F1F2F6;--surface:#fff;--ink:#1B1F3B;--muted:#5B6080;--line:#D9DCE7;--red:#BE3B33}
@media (prefers-color-scheme:dark){:root{--paper:#11132A;--surface:#1A1D38;--ink:#ECEDF6;--muted:#A2A6C4;--line:#2D3154;--red:#F2766C}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:16px;box-sizing:border-box}
form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:1.3rem}p{margin:0;color:var(--muted);font-size:.9rem}
input{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--ink);color:var(--paper);cursor:pointer}
button:disabled{opacity:.6}#err{color:var(--red)}#err:empty{display:none}</style></head><body>
<form id="f"><h1>Private page</h1><p>Enter the password you were given.</p>
<input id="pw" type="password" autocomplete="current-password" aria-label="Password" required autofocus>
<button id="b">Open</button><p id="err" role="alert"></p></form>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:N,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c)));
  try{sessionStorage.setItem("nt.pw",pw)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const b=document.getElementById("b");b.disabled=true;b.textContent="Opening…";
  try{await open_(document.getElementById("pw").value)}
  catch(x){document.getElementById("err").textContent="Wrong password. Try again.";b.disabled=false;b.textContent="Open"}
});
let saved=null;try{saved=sessionStorage.getItem("nt.pw")}catch(e){}
if(saved)open_(saved).catch(()=>{try{sessionStorage.removeItem("nt.pw")}catch(e){}});
