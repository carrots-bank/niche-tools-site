button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--ink);color:var(--paper);cursor:pointer}
button:disabled{opacity:.6}#err{color:var(--red)}#err:empty{display:none}</style></head><body>

  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:N,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
