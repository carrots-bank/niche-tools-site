async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:N,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c)));
  try{sessionStorage.setItem("nt.pw",pw)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const b=document.getElementById("b");b.disabled=true;b.textContent="Opening…";
  try{await open_(document.getElementById("pw").value)}
  catch(x){document.getElementById("err").textContent="Wrong password. Try again.";b.disabled=false;b.textContent="Open"}
});
let saved=null;try{saved=sessionStorage.getItem("nt.pw")}catch(e){}
